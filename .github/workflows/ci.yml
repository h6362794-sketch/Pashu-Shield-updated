name: ci
on: { push: { branches: [main, "redesign/**", "arena/**"] }, pull_request: {}, schedule: [{ cron: "0 3 * * 1" }] }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "Syntax (lint substitute: no build step in this repo)"
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: "Frontend tests (header/footer/consent, validators, a11y static, XSS, branding)"
        run: node --test frontend/tests/*.test.mjs
      - name: "Contrast gate (WCAG 1.4.3 / 1.4.11)"
        run: node scripts/check-contrast.mjs
      - name: Image budgets
        run: node scripts/check-images.mjs
      - name: Backend validator tests
        run: python -m unittest discover -s backend/tests -p "test_validators.py"
      - name: 'Dependency audit ("Safe to Host" evidence)'
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true   # record result in docs/compliance/SECURITY_CHECKLIST.md
      - name: "External link check (weekly)"
        if: github.event_name == 'schedule'
        run: node scripts/check-links.mjs
  # ADVISORY, not blocking (docs/compliance/DECISIONS.md D-12). This audits a
  # STATIC frontend with no backend attached, so authenticated routes render
  # their signed-out state, while lighthouserc.json demands a perfect (1.0)
  # accessibility score and 0.9 performance at 360px. It is kept because the
  # numbers are still useful evidence, but it must not gate merges until it is
  # pointed at a real deployment (PM_AUDIT_URL) with the API reachable.
  lighthouse-axe:
    runs-on: ubuntu-latest
    needs: checks
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "Lighthouse CI (mobile) + pa11y/axe"
        run: |
          npm i -g @lhci/cli@0.14 pa11y-ci@3 http-server
          if [ -z "${PM_AUDIT_URL:-}" ]; then http-server frontend -p 8080 -s & sleep 2; fi
          lhci autorun --config=lighthouserc.json || echo "::warning::lighthouse assertions not met (advisory job)"
          pa11y-ci --config .pa11yci.json || echo "::warning::pa11y/axe issues found (advisory job)"
